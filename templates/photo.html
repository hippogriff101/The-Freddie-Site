{% extends "base.html" %}

{% block description %}Here are some of Freddie's featured photo's!{% endblock %}

{% block content %}

    <h2>A place to store my photos!</h2>

    <div class="photos" style="display: grid; grid-template-columns: repeat(3, 200px); gap: 8px 8px; justify-content: center; align-items: start;">
        <figure style="margin: 0; width: 200px; text-align: left;">
        <img src="{{ url_for('static', filename='assets/IMG_1595.JPG') }}" alt="Photo 1">

        </figure>
        <figure style="margin: 0; width: 200px; text-align: center;">

        </figure>

        </figure>
        <figure style="margin: 0; width: 200px; text-align: left;">
        <img src="{{ url_for('static', filename='assets/IMG_1729.JPG') }}" alt="Photo 4">
