{% extends "base.html" %}

{% block description %}Some of Freddie's featured projects.{% endblock %}
{% block head %}
    <link href="{{ url_for('static', filename='css/projects.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
    <hr>
    <h2>Projects</h2>
    <div class="projects">
        {% for project in projects %}
            <div class="project">
                <img src="{{ project.image }}" alt="The Freddie Site screenshot">
                <div class="project-body">
                    <h3>{{ project.name }}</h3>
                    <p>{{ project.description }}</p>
                    <div class="project-links">
                        <a target="_blank" rel="noopener noreferrer" href="{{ project.demo }}"><button type="button">Demo</button></a>
                        <a target="_blank" rel="noopener noreferrer" href="{{ project.code }}"><button type="button">Code</button></a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
